# Builds one service image from the repo root:
#   gcloud builds submit --config infra/cloudbuild.yaml --substitutions _DOCKERFILE=services/api/Dockerfile,_IMAGE=... .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "${_DOCKERFILE}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
